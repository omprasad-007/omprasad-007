name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Runs every 24 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: generate github-contribution-grid-snake.svg
        id: generate
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Fallback: create animated placeholder SVGs if generation failed
        if: ${{ steps.generate.outcome != 'success' }}
        run: |
          mkdir -p dist
          cat > dist/github-contribution-grid-snake.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120" preserveAspectRatio="xMidYMid meet">
            <rect width="100%" height="100%" fill="#f6f8fa"/>
            <g id="snake">
              <rect x="10" y="44" width="28" height="28" rx="6" fill="#0366d6">
                <animate attributeName="x" dur="2.2s" values="10;560;10" repeatCount="indefinite" />
              </rect>
              <rect x="-20" y="44" width="28" height="28" rx="6" fill="#58a6ff">
                <animate attributeName="x" dur="2.2s" values="-20;540;-20" begin="0.13s" repeatCount="indefinite" />
              </rect>
              <rect x="-50" y="44" width="28" height="28" rx="6" fill="#1f6feb">
                <animate attributeName="x" dur="2.2s" values="-50;520;-50" begin="0.26s" repeatCount="indefinite" />
              </rect>
              <rect x="-80" y="44" width="28" height="28" rx="6" fill="#0b57d0">
                <animate attributeName="x" dur="2.2s" values="-80;500;-80" begin="0.39s" repeatCount="indefinite" />
              </rect>
            </g>
            <text x="50%" y="105" dominant-baseline="middle" text-anchor="middle" fill="#234a7e" font-family="Arial, Helvetica, sans-serif" font-size="13">Contribution Snake (animated)</text>
          </svg>
          SVG

          cat > dist/github-contribution-grid-snake-dark.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120" preserveAspectRatio="xMidYMid meet">
            <rect width="100%" height="100%" fill="#0d1117"/>
            <g id="snake">
              <rect x="10" y="44" width="28" height="28" rx="6" fill="#58a6ff">
                <animate attributeName="x" dur="2.2s" values="10;560;10" repeatCount="indefinite" />
              </rect>
              <rect x="-20" y="44" width="28" height="28" rx="6" fill="#2da3ff">
                <animate attributeName="x" dur="2.2s" values="-20;540;-20" begin="0.13s" repeatCount="indefinite" />
              </rect>
              <rect x="-50" y="44" width="28" height="28" rx="6" fill="#1b74d1">
                <animate attributeName="x" dur="2.2s" values="-50;520;-50" begin="0.26s" repeatCount="indefinite" />
              </rect>
              <rect x="-80" y="44" width="28" height="28" rx="6" fill="#1366c8">
                <animate attributeName="x" dur="2.2s" values="-80;500;-80" begin="0.39s" repeatCount="indefinite" />
              </rect>
            </g>
            <text x="50%" y="105" dominant-baseline="middle" text-anchor="middle" fill="#58a6ff" font-family="Arial, Helvetica, sans-serif" font-size="13">Contribution Snake (animated - dark)</text>
          </svg>
          SVG

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
